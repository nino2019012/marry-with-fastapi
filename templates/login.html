{% extends "base.html" %}

{% block title %}
  로그인
{% endblock %}

{% block content %}
<div class="card w-96 bg-base-200 shadow-xl border border-base-300 mx-auto gap-4">
  <h1 class="text-2xl font-bold mb-4 text-center">로그인 페이지</h1>

  <form action="/token" method="post" id="login-form" class="flex flex-col gap-3">
    <div>
        <label class="input input-bordered validator flex items-center gap-2 w-full">
          <!-- 전화번호 SVG 아이콘 -->
          <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <g fill="none">
              <path d="M7.25 11.5C6.83579 11.5 6.5 11.8358 6.5 12.25C6.5 12.6642 6.83579 13 7.25 13H8.75C9.16421 13 9.5 12.6642 9.5 12.25C9.5 11.8358 9.16421 11.5 8.75 11.5H7.25Z" fill="currentColor"></path>
              <path fill-rule="evenodd" clip-rule="evenodd" d="M6 1C4.61929 1 3.5 2.11929 3.5 3.5V12.5C3.5 13.8807 4.61929 15 6 15H10C11.3807 15 12.5 13.8807 12.5 12.5V3.5C12.5 2.11929 11.3807 1 10 1H6ZM10 2.5H9.5V3C9.5 3.27614 9.27614 3.5 9 3.5H7C6.72386 3.5 6.5 3.27614 6.5 3V2.5H6C5.44771 2.5 5 2.94772 5 3.5V12.5C5 13.0523 5.44772 13.5 6 13.5H10C10.5523 13.5 11 13.0523 11 12.5V3.5C11 2.94772 10.5523 2.5 10 2.5Z" fill="currentColor"></path>
            </g>
          </svg>
          <!-- 전화번호 input -->
          <input
            type="tel"
            name="username"
            id="phone_number"
            class="grow tabular-nums"
            required
            placeholder="전화번호 (11자리)"
            pattern="[0-9]*"
            minlength="11"
            maxlength="11"
            title="Must be 11 digits"
          />
        </label>
        <!-- 검증 실패 시 표시되는 안내문구 -->
        <p class="validator-hint text-xs text-error mt-1 hidden">11자리 숫자를 입력해 주세요.</p>
      </div>
  
      <label class="input validator w-full">
        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor"
          >
        <path
          d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
        ></path>
        <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
      </g>
    </svg>
    <input
      type="password"
      required
      placeholder="Password"
      minlength="1"
      title="비밀번호를 최소 1자 이상 입력해주세요."
    />
  </label>
  <p class="validator-hint hidden">
    Must be more than 8 characters, including
    <br />At least one number <br />At least one lowercase letter <br />At least one uppercase letter
  </p>
      <button type="submit" class="btn btn-primary w-full">
        로그인
      </button>
    </form>
  </div>
{% endblock %}
